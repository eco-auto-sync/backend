server:
  port: 8081

spring:
  application:
    name: eco-sync-batch
  datasource:
    url: jdbc:h2:mem:ecosync
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: true
        jdbc:
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true
  batch:
    jdbc:
      initialize-database: always
    job:
      enabled: false
  task:
    scheduling:
      pool:
        size: 10
      thread-name-prefix: batch-scheduler-
